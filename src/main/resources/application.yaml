spring:
  application:
    name: promotion_service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/promotion
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    group-id: promotion_service

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost

    elasticsearch:
      port: 9200
      host: localhost
      indexes:
        users: "users"
      index:
        auto-create: true
server:
  port: 8085

logging:
  level:
    root: info

jwt:
  access:
    secret: fe36efc1dc7ed4e847bba155b7932318f2729c68428c891f90de21849851aa4a
    expiration: 600000
  refresh:
    secret: fe36efc1dc7ed4e847bba155b7932318f2729c68428c891f90de21849851aa4a
    expiration: 604800000

account-service:
  host: http://localhost
  port: 8090
